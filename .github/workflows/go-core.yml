name: Go Core CI

on:
  push:
    paths:
      - "core/**"
      - ".github/workflows/go-core.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/go-core.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: core/go.sum
      - run: go mod tidy
      - run: go test -race ./...
      - run: go vet ./...
